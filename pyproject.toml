[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modpack-fixer"
version = "0.1.0"
description = "Solver determinístico + lockfile para modpacks Minecraft (Modrinth / CurseForge)"
requires-python = ">=3.9"
readme = "README.md"
requires = []

[project.scripts]
mpfix = "modpack_fixer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modpack_fixer*"]
